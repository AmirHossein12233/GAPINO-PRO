<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0f172a">

    <title>گپینو | چت</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=308"
    >

    <style>
        /* =====================================================
           پایه
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            overflow: hidden;
        }

        body {
            overflow: hidden;
            font-family: inherit;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        /* =====================================================
           APP LAYOUT
           ===================================================== */

        .app-shell {
            width: 100%;
            height: 100dvh;
            min-height: 100vh;

            display: flex;
            flex-direction: row;

            overflow: hidden;
        }

        /* =====================================================
           SIDEBAR
           در RTL سمت راست قرار می‌گیرد
           ===================================================== */

        .sidebar {
            width: 340px;
            min-width: 340px;
            height: 100%;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;
            padding: 14px;
        }

        .brand {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .brand-logo {
            flex: 0 0 auto;

            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            font-size: 20px;
            font-weight: 900;
        }

        .brand-text {
            min-width: 0;

            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-text strong {
            font-size: 18px;
            font-weight: 900;
        }

        .brand-text span {
            font-size: 12px;
            opacity: 0.65;
        }

        .search-box {
            padding: 0 14px 12px;
        }

        .search-box input {
            width: 100%;
            height: 44px;

            padding: 0 14px;

            border-radius: 14px;
            border: 0;
            outline: none;
        }

        .users-list {
            flex: 1 1 auto;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 6px 8px 10px;
        }

        .user-item {
            width: 100%;

            border: 0;
            outline: none;
            background: transparent;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px;

            border-radius: 16px;

            text-align: right;

            cursor: pointer;
        }

        .user-item-avatar {
            flex: 0 0 auto;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .user-item-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-item-info {
            min-width: 0;
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 3px;
        }

        .user-item-info strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-item-info span {
            font-size: 12px;
            opacity: 0.65;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-footer {
            flex: 0 0 auto;

            display: flex;
            gap: 8px;

            padding: 10px 12px 14px;
        }

        .sidebar-action {
            flex: 1;

            min-height: 42px;

            border: 0;
            border-radius: 14px;

            cursor: pointer;
        }

        /* =====================================================
           CHAT AREA
           ===================================================== */

        .chat-area {
            min-width: 0;
            min-height: 0;

            flex: 1 1 auto;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .chat-header {
            flex: 0 0 auto;

            width: 100%;
            min-height: 72px;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px 14px;

            overflow: hidden;
        }

        .chat-contact {
            min-width: 0;
            flex: 1 1 auto;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .chat-avatar {
            flex: 0 0 auto;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-contact-info {
            min-width: 0;

            display: flex;
            flex-direction: column;

            gap: 3px;
        }

        .chat-contact-info strong,
        .chat-contact-info span {
            display: block;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-contact-info span {
            font-size: 12px;
            opacity: 0.65;
        }

        .chat-header-actions {
            flex: 0 0 auto;

            display: flex;
            align-items: center;

            gap: 5px;

            margin-inline-start: auto;
        }

        .chat-header-actions .icon-button {
            flex: 0 0 auto;

            width: 42px !important;
            min-width: 42px !important;
            max-width: 42px !important;

            height: 42px !important;
            min-height: 42px !important;
            max-height: 42px !important;

            padding: 0 !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            visibility: visible !important;
        }

        #callButton {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;

            pointer-events: auto !important;

            font-size: 19px !important;
        }

        #callButton:disabled {
            opacity: 0.45 !important;
        }

        /* =====================================================
           MESSAGES AREA
           ===================================================== */

        .messages-container {
            position: relative;

            flex: 1 1 auto;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 18px 16px 12px;

            scroll-behavior: smooth;
        }

        .messages-list {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .message-row {
            width: 100%;

            display: flex;
        }

        .message-row.mine {
            justify-content: flex-start;
        }

        .message-row.theirs {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: min(72%, 680px);

            padding: 10px 13px;

            border-radius: 18px;

            overflow-wrap: anywhere;
            word-break: break-word;

            line-height: 1.65;
        }

        .message-file-link {
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .empty-chat {
            min-height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .empty-chat-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-chat h2 {
            margin: 0 0 8px;
        }

        .empty-chat p {
            margin: 0;

            opacity: 0.65;
        }

        .typing-indicator {
            position: sticky;

            bottom: 8px;

            width: max-content;

            margin-top: 5px;

            padding: 6px 11px;

            border-radius: 12px;

            font-size: 12px;
        }

        /* =====================================================
           COMPOSER
           ===================================================== */

        .chat-composer {
            flex: 0 0 auto;

            display: flex;
            align-items: flex-end;

            gap: 8px;

            padding:
                10px 12px
                max(
                    10px,
                    env(safe-area-inset-bottom)
                );
        }

        .chat-composer textarea {
            flex: 1 1 auto;

            min-width: 0;
            max-height: 150px;

            resize: none;

            padding: 11px 14px;

            border-radius: 18px;

            outline: none;
        }

        .composer-button,
        .send-button {
            flex: 0 0 auto;

            width: 44px;
            height: 44px;

            min-width: 44px;
            min-height: 44px;

            border: 0;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        /* =====================================================
           PROFILE / SEARCH MODAL
           ===================================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 100000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            background: rgba(2, 6, 23, 0.74);
            backdrop-filter: blur(8px);
        }

        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-card {
            width: min(440px, 100%);
            max-height: calc(100dvh - 36px);

            overflow: auto;

            position: relative;

            padding: 22px;

            border-radius: 24px;
        }

        .modal-close {
            position: absolute;

            inset-inline-start: 14px;
            top: 12px;

            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 10px;

            cursor: pointer;
        }

        .modal-header {
            margin-bottom: 18px;
        }

        .profile-form {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .profile-avatar-preview {
            width: 88px;
            height: 88px;

            margin: 0 auto 10px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 28px;
            font-weight: 800;
        }

        .profile-avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-input {
            width: 100%;

            border: 0;
            outline: none;

            padding: 11px 13px;

            border-radius: 13px;
        }

        .primary-button {
            min-height: 46px;

            border: 0;
            border-radius: 14px;

            cursor: pointer;

            font-weight: 800;
        }

        .message-search-results {
            margin-top: 14px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .message-search-item {
            padding: 10px 12px;
            border-radius: 12px;
        }

        /* =====================================================
           TOAST
           ===================================================== */

        .toast-container {
            position: fixed;

            z-index: 110000;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            width: min(92vw, 420px);

            pointer-events: none;
        }

        .gapino-toast {
            padding: 11px 14px;

            border-radius: 14px;

            text-align: center;

            margin-top: 8px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.18);
        }

        /* =====================================================
           CALL UI
           ===================================================== */

        .gapino-call-overlay {
            position: fixed;

            inset: 0;

            z-index: 120000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            background: rgba(2, 6, 23, 0.80);

            backdrop-filter: blur(13px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        .gapino-call-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .gapino-call-card {
            width: min(410px, 100%);

            padding: 28px 22px;

            border-radius: 28px;

            background: #0f172a;
            color: #fff;

            text-align: center;

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.45);
        }

        .gapino-call-avatar {
            width: 96px;
            height: 96px;

            margin: 0 auto 16px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 34px;
            font-weight: 900;
        }

        .gapino-call-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gapino-call-name {
            font-size: 22px;
            font-weight: 900;

            margin-bottom: 7px;
        }

        .gapino-call-status {
            font-size: 14px;
            opacity: 0.72;

            margin-bottom: 10px;
        }

        .gapino-call-timer {
            font-size: 30px;
            font-weight: 900;

            margin-bottom: 22px;
        }

        .gapino-call-actions {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 9px;
        }

        .gapino-call-button {
            min-width: 120px;

            padding: 12px 16px;

            border: 0;
            border-radius: 14px;

            color: #fff;

            font-weight: 800;

            cursor: pointer;
        }

        .gapino-call-button.accept {
            background: #16a34a;
        }

        .gapino-call-button.reject {
            background: #dc2626;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 800px) {

            html,
            body {
                width: 100%;
                height: 100dvh;
            }

            .app-shell {
                height: 100dvh;
                min-height: 100dvh;
            }

            .sidebar {
                width: 100%;
                min-width: 100%;
            }

            .chat-area {
                display: none;
                width: 100%;
                min-width: 100%;
            }

            /*
             * وقتی یک چت انتخاب شد،
             * chat.js این کلاس را اضافه می‌کند.
             */

            .app-shell.chat-open .sidebar {
                display: none;
            }

            .app-shell.chat-open .chat-area {
                display: flex;
            }

            .chat-header {
                min-height: 64px;

                padding:
                    max(8px, env(safe-area-inset-top))
                    8px
                    8px
                    8px;
            }

            .chat-header-actions {
                gap: 3px;
            }

            .chat-header-actions .icon-button {
                width: 40px !important;
                min-width: 40px !important;
                max-width: 40px !important;

                height: 40px !important;
                min-height: 40px !important;
                max-height: 40px !important;
            }

            #callButton {
                display: flex !important;
                visibility: visible !important;
                opacity: 1 !important;

                font-size: 18px !important;
            }

            .chat-avatar {
                width: 42px;
                height: 42px;
            }

            .messages-container {
                padding:
                    12px 10px
                    8px;
            }

            .message-bubble {
                max-width: 84%;
            }

            .chat-composer {
                padding:
                    8px
                    8px
                    max(
                        8px,
                        env(safe-area-inset-bottom)
                    );
            }

            .composer-button,
            .send-button {
                width: 42px;
                height: 42px;

                min-width: 42px;
                min-height: 42px;
            }

            .gapino-call-card {
                width: min(360px, 100%);

                padding: 24px 16px;

                border-radius: 24px;
            }

            .gapino-call-avatar {
                width: 82px;
                height: 82px;

                font-size: 30px;
            }

            .gapino-call-name {
                font-size: 20px;
            }

            .gapino-call-timer {
                font-size: 27px;
            }

            .gapino-call-button {
                width: 100%;
            }
        }

        @media (max-width: 420px) {

            .chat-header-actions .icon-button {
                width: 38px !important;
                min-width: 38px !important;
                max-width: 38px !important;

                height: 38px !important;
                min-height: 38px !important;
                max-height: 38px !important;
            }

            #callButton {
                font-size: 17px !important;
            }

            .chat-contact {
                gap: 7px;
            }

            .chat-contact-info strong {
                font-size: 14px;
            }

            .chat-contact-info span {
                font-size: 11px;
            }
        }

        /* =====================================================
           REDUCE MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         APP
         ===================================================== -->

    <div class="app-shell" id="appShell">

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-header">

                <div class="brand">

                    <div class="brand-logo">
                        G
                    </div>

                    <div class="brand-text">
                        <strong>گپینو</strong>
                        <span>پیام‌رسان</span>
                    </div>

                </div>

                <button
                    id="newChatButton"
                    class="icon-button"
                    type="button"
                    title="گفتگوی جدید"
                    aria-label="گفتگوی جدید"
                >
                    ✏️
                </button>

            </div>

            <div class="search-box">

                <input
                    id="userSearch"
                    type="search"
                    placeholder="جستجوی کاربران..."
                    autocomplete="off"
                    spellcheck="false"
                >

            </div>

            <div
                id="usersList"
                class="users-list"
            >
            </div>

            <div class="sidebar-footer">

                <button
                    id="profileButton"
                    class="sidebar-action"
                    type="button"
                >
                    👤
                    <span>پروفایل</span>
                </button>

                <button
                    id="logoutButton"
                    class="sidebar-action"
                    type="button"
                >
                    🚪
                    <span>خروج</span>
                </button>

            </div>

        </aside>

        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <main
            id="chatArea"
            class="chat-area"
        >

            <!-- HEADER -->

            <header class="chat-header">

                <div class="chat-contact">

                    <div
                        id="chatAvatar"
                        class="chat-avatar"
                    >
                        G
                    </div>

                    <div class="chat-contact-info">

                        <strong
                            id="chatUserName"
                        >
                            انتخاب گفتگو
                        </strong>

                        <span
                            id="chatUserStatus"
                        >
                            یک کاربر را انتخاب کنید
                        </span>

                    </div>

                </div>

                <div
                    class="chat-header-actions"
                >

                    <!-- تماس صوتی -->

                    <button
                        id="callButton"
                        class="icon-button"
                        type="button"
                        title="تماس صوتی"
                        aria-label="تماس صوتی"
                    >
                        📞
                    </button>

                    <!-- جستجو -->

                    <button
                        id="chatSearchButton"
                        class="icon-button"
                        type="button"
                        title="جستجوی پیام"
                        aria-label="جستجوی پیام"
                    >
                        🔎
                    </button>

                    <!-- منو -->

                    <button
                        id="chatMenuButton"
                        class="icon-button"
                        type="button"
                        title="منو"
                        aria-label="منو"
                    >
                        ⋮
                    </button>

                </div>

            </header>

            <!-- MESSAGES -->

            <section
                id="messagesContainer"
                class="messages-container"
            >

                <div
                    id="emptyChat"
                    class="empty-chat"
                >

                    <div class="empty-chat-icon">
                        💬
                    </div>

                    <h2>
                        به گپینو خوش آمدی
                    </h2>

                    <p>
                        برای شروع، یک کاربر را از فهرست انتخاب کن.
                    </p>

                </div>

                <div
                    id="messagesList"
                    class="messages-list"
                >
                </div>

                <div
                    id="typingIndicator"
                    class="typing-indicator"
                    hidden
                >
                    در حال نوشتن...
                </div>

            </section>

            <!-- ATTACHMENT PREVIEW -->

            <div
                id="attachmentPreview"
                class="attachment-preview"
                hidden
            >
            </div>

            <!-- COMPOSER -->

            <div class="chat-composer">

                <button
                    id="attachButton"
                    class="composer-button"
                    type="button"
                    title="پیوست فایل"
                    aria-label="پیوست فایل"
                >
                    📎
                </button>

                <input
                    id="fileInput"
                    type="file"
                    hidden
                >

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="پیامت را بنویس..."
                    autocomplete="off"
                    spellcheck="false"
                ></textarea>

                <button
                    id="voiceButton"
                    class="composer-button"
                    type="button"
                    title="ضبط صدا"
                    aria-label="ضبط صدا"
                >
                    🎙️
                </button>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    title="ارسال"
                    aria-label="ارسال"
                >
                    ➤
                </button>

            </div>

        </main>

    </div>

    <!-- =====================================================
         PROFILE MODAL
         ===================================================== -->

    <div
        id="profileModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal-card">

            <button
                id="closeProfileModal"
                class="modal-close"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>

            <div class="modal-header">
                <h2>پروفایل</h2>
            </div>

            <div class="profile-form">

                <div
                    id="profileAvatarPreview"
                    class="profile-avatar-preview"
                >
                    G
                </div>

                <label
                    class="form-label"
                    for="profileDisplayName"
                >
                    نام نمایشی
                </label>

                <input
                    id="profileDisplayName"
                    class="form-input"
                    type="text"
                    maxlength="60"
                    autocomplete="off"
                >

                <label
                    class="form-label"
                    for="profileBio"
                >
                    درباره من
                </label>

                <textarea
                    id="profileBio"
                    class="form-input"
                    rows="4"
                    maxlength="250"
                ></textarea>

                <button
                    id="saveProfileButton"
                    class="primary-button"
                    type="button"
                >
                    ذخیره تغییرات
                </button>

            </div>

        </div>

    </div>

    <!-- =====================================================
         MESSAGE SEARCH MODAL
         ===================================================== -->

    <div
        id="messageSearchModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal-card">

            <button
                id="closeMessageSearchModal"
                class="modal-close"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>

            <div class="modal-header">
                <h2>جستجوی پیام</h2>
            </div>

            <input
                id="messageSearchInput"
                class="form-input"
                type="search"
                placeholder="متن پیام..."
                autocomplete="off"
