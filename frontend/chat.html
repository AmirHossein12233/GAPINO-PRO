<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080d1a"
    >

    <title>گپینو | چت</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=306"
    >

    <style>

        [hidden] {
            display: none !important;
        }

        /* =====================================================
           VOICE CALL
           ===================================================== */

        .gapino-call-overlay {
            position: fixed;
            inset: 0;
            z-index: 50000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(3, 7, 18, .82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        .gapino-call-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .gapino-call-card {
            width: min(420px, 100%);
            padding: 38px 22px 28px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 30px;
            text-align: center;
            background: linear-gradient(
                145deg,
                #121a2d,
                #09101f
            );
            box-shadow:
                0 35px 100px rgba(0,0,0,.45);
        }

        .gapino-call-avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 28px;
            color: #fff;
            font-size: 34px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );
            box-shadow:
                0 18px 50px
                rgba(99,102,241,.30);
            animation:
                gapinoCallPulse 2s infinite;
        }

        .gapino-call-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gapino-call-name {
            color: #f8fafc;
            font-size: 22px;
            font-weight: 800;
        }

        .gapino-call-status {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        .gapino-call-timer {
            margin-top: 8px;
            color: #a5b4fc;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .gapino-call-actions {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .gapino-call-button {
            min-width: 108px;
            min-height: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            color: white;
            background: rgba(255,255,255,.05);
            cursor: pointer;
            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .gapino-call-button.accept {
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );
        }

        .gapino-call-button.reject {
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );
        }

        .gapino-call-button:hover {
            transform: translateY(-2px);
        }

        #voiceButton.recording {
            background:
                rgba(239,68,68,.18) !important;
            border-color:
                rgba(239,68,68,.4) !important;
            color:
                #fca5a5 !important;
            animation:
                gapinoVoicePulse 1.2s infinite;
        }

        @keyframes gapinoVoicePulse {
            0% {
                box-shadow:
                    0 0 0 0
                    rgba(239,68,68,.20);
            }

            50% {
                box-shadow:
                    0 0 0 7px
                    rgba(239,68,68,0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(239,68,68,0);
            }
        }

        @keyframes gapinoCallPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }

        .message-audio {
            max-width: 100%;
            min-width: min(260px,100%);
        }

        .message-audio audio {
            display: block;
            width: 100%;
            max-width: 100%;
        }

        .voice-name {
            margin-top: 6px;
            color: rgba(255,255,255,.7);
            font-size: 10px;
        }

        .message-image {
            display: block;
            max-width: min(380px,100%);
            max-height: 450px;
            border-radius: 14px;
            object-fit: cover;
            cursor: pointer;
        }

        /* =====================================================
           MOBILE HEADER / CALL BUTTON
           ===================================================== */

        @media (max-width: 700px) {

            .chat-header {
                display: flex !important;
                align-items: center !important;
                gap: 6px !important;
                min-width: 0;
            }

            .chat-header-actions {
                display: flex !important;
                align-items: center !important;
                justify-content: flex-end !important;
                gap: 4px !important;
                margin-inline-start: auto !important;
                flex-shrink: 0 !important;
            }

            .chat-header-actions .icon-button {
                width: 42px !important;
                height: 42px !important;
                min-width: 42px !important;
                max-width: 42px !important;
                padding: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                opacity: 1 !important;
                visibility: visible !important;
            }

            #callButton {
                display: flex !important;
                visibility: visible !important;
                opacity: 1 !important;
                pointer-events: auto !important;
                font-size: 18px !important;
            }

            #callButton:disabled {
                opacity: .50 !important;
            }

            .chat-contact {
                min-width: 0 !important;
                flex: 1 !important;
            }

            .chat-contact-info {
                min-width: 0 !important;
            }

            .chat-contact-info strong,
            .chat-contact-info span {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .gapino-call-card {
                padding: 32px 17px 22px;
            }

            .gapino-call-avatar {
                width: 86px;
                height: 86px;
                font-size: 30px;
            }

            .gapino-call-name {
                font-size: 20px;
            }

            .gapino-call-button {
                min-width: 96px;
            }
        }

    </style>

</head>


<body>

<div
    id="appShell"
    class="app-shell"
>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <div class="sidebar-brand">

                <div
                    class="sidebar-logo"
                    aria-hidden="true"
                >
                    G
                </div>

                <div>

                    <h1>گپینو</h1>

                    <span>
                        پیام‌رسان شما
                    </span>

                </div>

            </div>

            <button
                id="menuButton"
                class="icon-button"
                type="button"
                aria-label="بستن منو"
            >
                ☰
            </button>

        </div>


        <div class="current-user-card">

            <button
                id="profileButton"
                class="current-user-main"
                type="button"
            >

                <div
                    id="currentAvatar"
                    class="avatar avatar-large"
                >
                    G
                </div>

                <div class="current-user-info">

                    <strong id="currentDisplayName">
                        گپینو
                    </strong>

                    <span id="currentUsername">
                        @user
                    </span>

                </div>

            </button>

            <span
                class="online-dot"
                aria-label="آنلاین"
            ></span>

        </div>


        <div class="search-box">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="userSearch"
                type="search"
                placeholder="جستجوی کاربران..."
                autocomplete="off"
            >

            <button
                id="clearSearch"
                class="search-clear"
                type="button"
                hidden
            >
                ×
            </button>

        </div>


        <div class="list-header">

            <span>
                کاربران
            </span>

            <span id="userCount">
                0
            </span>

        </div>


        <div
            id="userList"
            class="user-list"
        >

            <div class="empty-users">

                <div class="empty-icon">
                    💬
                </div>

                <strong>
                    در حال دریافت کاربران...
                </strong>

                <span>
                    لطفاً کمی صبر کن.
                </span>

            </div>

        </div>


        <div class="sidebar-footer">

            <button
                id="themeButton"
                class="sidebar-action"
                type="button"
            >
                ☀️ حالت روشن
            </button>

            <button
                id="logoutButton"
                class="sidebar-action danger"
                type="button"
            >
                🚪 خروج از حساب
            </button>

        </div>

    </aside>


    <!-- =====================================================
         CHAT
         ===================================================== -->

    <main class="chat-main">

        <header class="chat-header">

            <button
                id="mobileMenuButton"
                class="icon-button mobile-only"
                type="button"
                aria-label="کاربران"
            >
                ☰
            </button>


            <div
                id="chatContact"
                class="chat-contact"
                hidden
            >

                <div
                    id="chatAvatar"
                    class="avatar"
                >
                    G
                </div>

                <div class="chat-contact-info">

                    <strong id="chatName">
                        کاربر
                    </strong>

                    <span id="chatStatus">
                        آفلاین
                    </span>

                </div>

            </div>


            <div
                id="chatHeaderEmpty"
                class="chat-header-empty"
            >

                <strong>
                    گپینو
                </strong>

                <span>
                    گفتگوی خودت را انتخاب کن
                </span>

            </div>


            <div class="chat-header-actions">

                <button
                    id="callButton"
                    class="icon-button"
                    type="button"
                    title="تماس صوتی"
                    aria-label="تماس صوتی"
                    disabled
                >
                    📞
                </button>

                <button
                    id="refreshButton"
                    class="icon-button"
                    type="button"
                    title="به‌روزرسانی"
                    aria-label="به‌روزرسانی"
                >
                    ↻
                </button>

                <button
                    id="profileHeaderButton"
                    class="icon-button"
                    type="button"
                    title="پروفایل"
                    aria-label="پروفایل"
                >
                    👤
                </button>

            </div>

        </header>


        <section
            id="welcomeScreen"
            class="welcome-screen"
        >

            <div class="welcome-card">

                <div
                    class="welcome-logo"
                    aria-hidden="true"
                >
                    G
                </div>

                <h2>
                    به گپینو خوش آمدی 👋
                </h2>

                <p>
                    یک کاربر را انتخاب کن تا گفتگو را شروع کنی.
                </p>

                <div class="welcome-features">

                    <div>
                        <span>⚡</span>
                        <small>گفتگوی سریع</small>
                    </div>

                    <div>
                        <span>🎙️</span>
                        <small>پیام صوتی</small>
                    </div>

                    <div>
                        <span>📞</span>
                        <small>تماس صوتی</small>
                    </div>

                    <div>
                        <span>📎</span>
                        <small>ارسال فایل</small>
                    </div>

                </div>

            </div>

        </section>


        <section
            id="chatView"
            class="chat-view"
            hidden
        >

            <div
                id="messages"
                class="messages"
                aria-live="polite"
            ></div>


            <div
                id="typingArea"
                class="typing-area"
                hidden
            >

                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <span>
                    در حال نوشتن...
                </span>

            </div>


            <div class="composer">

                <input
                    id="fileInput"
                    type="file"
                    hidden
                >

                <button
                    id="attachButton"
                    class="composer-button"
                    type="button"
                    title="ارسال فایل"
                    disabled
                >
                    📎
                </button>

                <button
                    id="voiceButton"
                    class="composer-button"
                    type="button"
                    title="ضبط پیام صوتی"
                    disabled
                >
                    🎙️
                </button>

                <div class="message-input-wrapper">

                    <textarea
                        id="messageInput"
                        rows="1"
                        maxlength="5000"
                        placeholder="یک کاربر را انتخاب کنید..."
                        autocomplete="off"
                        disabled
                    ></textarea>

                </div>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    disabled
                >
                    ➤
                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         PROFILE
         ===================================================== -->

    <aside
        id="profilePanel"
        class="profile-panel"
        hidden
    >

        <div class="profile-panel-header">

            <strong>
                پروفایل من
            </strong>

            <button
                id="closeProfile"
                class="icon-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="profile-content">

            <div
                id="profileAvatar"
                class="profile-avatar-large"
            >
                G
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                گپینو
            </div>

            <div
                id="profileUsername"
                class="profile-username"
            >
                @user
            </div>


            <div class="profile-section">

                <label for="editDisplayName">
                    نام نمایشی
                </label>

                <input
                    id="editDisplayName"
                    type="text"
                    maxlength="60"
                    placeholder="نام نمایشی"
                >

            </div>


            <div class="profile-section">

                <label for="editBio">
                    درباره من
                </label>

                <textarea
                    id="editBio"
                    maxlength="300"
                    rows="4"
                    placeholder="درباره خودت..."
                ></textarea>

            </div>


            <div class="profile-section">

                <label for="editStatus">
                    وضعیت
                </label>

                <select id="editStatus">

                    <option value="در دسترس">
                        🟢 در دسترس
                    </option>

                    <option value="مشغول">
                        🔴 مشغول
                    </option>

                    <option value="غیرفعال">
                        🟡 غیرفعال
                    </option>

                    <option value="نامرئی">
                        ⚫ نامرئی
                    </option>

                </select>

            </div>


            <button
                id="saveProfile"
                class="primary-button"
                type="button"
            >
                ذخیره تغییرات
            </button>


            <button
                id="profilePageButton"
                class="secondary-button"
                type="button"
            >
                صفحه کامل پروفایل
            </button>

        </div>

    </aside>


    <div
        id="appOverlay"
        class="app-overlay"
        hidden
    ></div>


    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


</div>


<script src="/frontend/chat.js?v=307" defer></script>
<script src="/frontend/call.js?v=5" defer></script>

</body>
</html>
