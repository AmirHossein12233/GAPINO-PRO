<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>گپینو | چت</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=310"
    >

    <style>
        /* =====================================================
           BASE
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            overflow: hidden;
        }

        body {
            overflow: hidden;
            font-family: inherit;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           APP
           ===================================================== */

        .app-shell {
            width: 100%;
            height: 100dvh;
            min-height: 100vh;

            display: flex;
            flex-direction: row;

            overflow: hidden;
        }

        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {
            width: 340px;
            min-width: 340px;
            height: 100%;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .sidebar-header {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 14px;
        }

        .brand {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .brand-logo {
            flex: 0 0 auto;

            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            font-size: 20px;
            font-weight: 900;
        }

        .brand-text {
            min-width: 0;

            display: flex;
            flex-direction: column;

            gap: 2px;
        }

        .brand-text strong {
            font-size: 18px;
            font-weight: 900;
        }

        .brand-text span {
            font-size: 12px;
            opacity: 0.65;
        }

        .search-box {
            flex: 0 0 auto;

            padding:
                0 14px 12px;
        }

        .search-box input {
            display: block;

            width: 100%;
            height: 44px;

            padding:
                0 14px;

            border-radius: 14px;

            border: 0;
            outline: none;
        }

        /* =====================================================
           ACTIVE LIVES
           ===================================================== */

        .active-lives-section {
            flex: 0 0 auto;

            margin:
                0 10px 8px;

            padding: 10px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(239, 68, 68, 0.11),
                    rgba(220, 38, 38, 0.035)
                );

            border:
                1px solid
                rgba(239, 68, 68, 0.14);

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.04);
        }

        .active-lives-section[hidden] {
            display: none !important;
        }

        .active-lives-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 8px;

            margin-bottom: 9px;
        }

        .active-lives-title {
            min-width: 0;

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 13px;

            font-weight: 900;

            color: #dc2626;
        }

        .active-lives-title .live-dot {
            width: 9px;
            height: 9px;

            flex: 0 0 auto;

            border-radius: 50%;

            background: #ef4444;

            box-shadow:
                0 0 0 4px
                rgba(239, 68, 68, 0.11);

            animation:
                gapinoLivePulse
                1.5s infinite;
        }

        @keyframes gapinoLivePulse {

            0% {
                opacity: 1;

                transform:
                    scale(1);
            }

            50% {
                opacity: 0.55;

                transform:
                    scale(0.82);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1);
            }
        }

        #refreshLivesButton {
            width: 30px;
            height: 30px;

            flex: 0 0 auto;

            border: 0;

            border-radius: 10px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 17px;

            transition:
                transform 0.15s ease;
        }

        #refreshLivesButton:active {
            transform:
                rotate(180deg)
                scale(0.96);
        }

        .active-lives-list {
            display: flex;

            flex-direction: column;

            gap: 7px;

            max-height: 205px;

            overflow-y: auto;

            overflow-x: hidden;
        }

        .active-live-item {
            width: 100%;

            min-height: 58px;

            border: 0;

            border-radius: 15px;

            padding:
                7px 8px;

            display: flex;

            align-items: center;

            gap: 9px;

            cursor: pointer;

            text-align: right;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.6
                );

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .active-live-item:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(0, 0, 0, 0.08);
        }

        .active-live-item:active {
            transform:
                scale(0.985);
        }

        .active-live-avatar {
            width: 43px;
            height: 43px;

            flex: 0 0 auto;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #f97316
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 900;

            box-shadow:
                0 4px 13px
                rgba(239, 68, 68, 0.22);
        }

        .active-live-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .active-live-info {
            flex: 1 1 auto;

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;
        }

        .active-live-name {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 13px;

            font-weight: 900;
        }

        .active-live-meta {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 11px;

            opacity: 0.67;
        }

        .active-live-badge {
            flex: 0 0 auto;

            padding:
                4px 7px;

            border-radius: 8px;

            background: #ef4444;

            color: #ffffff;

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.2px;

            box-shadow:
                0 4px 10px
                rgba(239, 68, 68, 0.2);
        }

        .active-lives-empty {
            padding:
                6px 3px;

            text-align: center;

            font-size: 11px;

            opacity: 0.62;
        }

        /* =====================================================
           USERS
           ===================================================== */

        .users-list {
            flex: 1 1 auto;

            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding:
                6px 8px 10px;
        }

        .user-item {
            width: 100%;

            border: 0;
            outline: none;

            background: transparent;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px;

            border-radius: 16px;

            text-align: right;

            cursor: pointer;
        }

        .user-item-avatar {
            flex: 0 0 auto;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .user-item-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .user-item-info {
            flex: 1 1 auto;

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;
        }

        .user-item-info strong {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .user-item-info span {
            font-size: 12px;

            opacity: 0.65;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        /* =====================================================
           SIDEBAR FOOTER
           ===================================================== */

        .sidebar-footer {
            flex: 0 0 auto;

            display: grid;

            grid-template-columns:
                1fr
                1fr
                1fr;

            gap: 8px;

            padding:
                10px 12px 14px;
        }

        .sidebar-action {
            min-height: 42px;

            border: 0;

            border-radius: 14px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            white-space: nowrap;
        }

        /* =====================================================
           START LIVE BUTTON
           ===================================================== */

        #liveButton {
            font-weight: 900;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            box-shadow:
                0 7px 20px
                rgba(220, 38, 38, 0.24);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        #liveButton:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 10px 26px
                rgba(220, 38, 38, 0.31);
        }

        #liveButton:active {
            transform:
                scale(0.98);
        }

        /* =====================================================
           CHAT
           ===================================================== */

        .chat-area {
            flex: 1 1 auto;

            min-width: 0;
            min-height: 0;

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .chat-header {
            flex: 0 0 auto;

            width: 100%;

            min-height: 72px;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                10px 14px;

            overflow: hidden;
        }

        .chat-contact {
            flex: 1 1 auto;

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .chat-avatar {
            flex: 0 0 auto;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .chat-contact-info {
            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;
        }

        .chat-contact-info strong,
        .chat-contact-info span {
            display: block;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .chat-contact-info span {
            font-size: 12px;

            opacity: 0.65;
        }

        .chat-header-actions {
            flex: 0 0 auto;

            display: flex;

            align-items: center;

            gap: 5px;

            margin-inline-start: auto;
        }

        .chat-header-actions .icon-button {
            flex: 0 0 auto;

            width: 42px !important;
            min-width: 42px !important;
            max-width: 42px !important;

            height: 42px !important;
            min-height: 42px !important;
            max-height: 42px !important;

            padding: 0 !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            visibility: visible !important;
        }

        /* =====================================================
           HEADER LIVE BUTTON
           ===================================================== */

        #headerLiveButton {
            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            flex: 0 0 auto;

            width: 42px !important;
            min-width: 42px !important;
            max-width: 42px !important;

            height: 42px !important;
            min-height: 42px !important;
            max-height: 42px !important;

            padding: 0 !important;

            border: 0 !important;

            border-radius: 12px !important;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                ) !important;

            color: #ffffff !important;

            box-shadow:
                0 5px 16px
                rgba(220, 38, 38, 0.23);

            cursor: pointer;

            font-size: 18px !important;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        #headerLiveButton:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 8px 21px
                rgba(220, 38, 38, 0.29);
        }

        #headerLiveButton:active {
            transform:
                scale(0.96);
        }

        #callButton {
            display: flex !important;

            visibility: visible !important;

            opacity: 1 !important;

            pointer-events: auto !important;

            font-size: 19px !important;

            cursor: pointer;
        }

        #callButton:disabled {
            opacity: 0.45 !important;
        }

        /* =====================================================
           MESSAGE AREA
           ===================================================== */

        .messages-container {
            position: relative;

            flex: 1 1 auto;

            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding:
                18px 16px 12px;

            scroll-behavior:
                smooth;
        }

        /* =====================================================
           MESSAGE BUBBLES
           ===================================================== */

        .messages-list {
            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .message-row {
            width: 100%;

            display: flex;

            margin:
                1px 0;
        }

        .message-row.mine {
            justify-content: flex-start;

            padding-left: 8px;
        }

        .message-row.theirs {
            justify-content: flex-end;

            padding-right: 8px;
        }

        .message-bubble {
            position: relative;

            width: fit-content;

            max-width:
                min(72%, 620px);

            padding:
                8px 12px;

            border-radius: 18px;

            font-size: 15px;

            line-height: 1.55;

            font-weight: 400;

            word-wrap: break-word;

            overflow-wrap: anywhere;

            white-space: pre-wrap;

            box-shadow:
                0 1px 2px
                rgba(0, 0, 0, 0.08);

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease;
        }

        .message-row.mine
            .message-bubble {

            background: #229ed9;

            color: #ffffff;

            border-bottom-right-radius:
                5px;
        }

        .message-row.theirs
            .message-bubble {

            background: #ffffff;

            color: #222222;

            border:
                1px solid
                rgba(0, 0, 0, 0.045);

            border-bottom-left-radius:
                5px;
        }

        .message-bubble p {
            margin: 0;
        }

        .message-bubble a {
            color: inherit;

            text-decoration:
                underline;
        }

        .message-file-link {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                2px 0;

            font-size: 14px;

            font-weight: 600;

            text-decoration:
                none !important;
        }

        .message-bubble audio {
            display: block;

            width:
                min(280px, 70vw);

            max-width: 100%;

            border-radius: 12px;
        }

        @media (hover: hover) {

            .message-bubble:hover {
                transform:
                    translateY(-1px);

                box-shadow:
                    0 3px 10px
                    rgba(0, 0, 0, 0.10);
            }
        }

        /* =====================================================
           EMPTY CHAT
           ===================================================== */

        .empty-chat {
            min-height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .empty-chat-icon {
            font-size: 48px;

            margin-bottom: 12px;
        }

        .empty-chat h2 {
            margin:
                0 0 8px;
        }

        .empty-chat p {
            margin: 0;

            opacity: 0.65;
        }

        .typing-indicator {
            position: sticky;

            bottom: 8px;

            width: max-content;

            margin-top: 5px;

            padding:
                6px 11px;

            border-radius: 12px;

            font-size: 12px;
        }

        /* =====================================================
           COMPOSER
           ===================================================== */

        .chat-composer {
            flex: 0 0 auto;

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding:
                10px 12px
                max(
                    10px,
                    env(safe-area-inset-bottom)
                );
        }

        .chat-composer textarea {
            flex: 1 1 auto;

            min-width: 0;

            max-height: 150px;

            resize: none;

            padding:
                11px 14px;

            border-radius: 18px;

            outline: none;
        }

        .composer-button,
        .send-button {
            flex: 0 0 auto;

            width: 44px;
            height: 44px;

            min-width: 44px;
            min-height: 44px;

            border: 0;

            border-radius: 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        /* =====================================================
           MODALS
           ===================================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 100000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 18px;

            background:
                rgba(
                    2,
                    6,
                    23,
                    0.74
                );

            backdrop-filter:
                blur(8px);
        }

        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-card {
            width:
                min(440px, 100%);

            max-height:
                calc(100dvh - 36px);

            overflow: auto;

            position: relative;

            padding: 22px;

            border-radius: 24px;
        }

        .modal-close {
            position: absolute;

            inset-inline-start:
                14px;

            top: 12px;

            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 10px;

            cursor: pointer;
        }

        .modal-header {
            margin-bottom: 18px;
        }

        .profile-form {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .profile-avatar-preview {
            width: 88px;
            height: 88px;

            margin:
                0 auto 10px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 28px;

            font-weight: 800;
        }

        .profile-avatar-preview img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .form-input {
            width: 100%;

            border: 0;

            outline: none;

            padding:
                11px 13px;

            border-radius: 13px;
        }

        .primary-button {
            min-height: 46px;

            border: 0;

            border-radius: 14px;

            cursor: pointer;

            font-weight: 800;
        }

        .message-search-results {
            margin-top: 14px;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .message-search-item {
            padding:
                10px 12px;

            border-radius: 12px;
        }

        /* =====================================================
           TOAST
           ===================================================== */

        .toast-container {
            position: fixed;

            z-index: 110000;

            left: 50%;

            bottom: 18px;

            transform:
                translateX(-50%);

            width:
                min(92vw, 420px);

            pointer-events: none;
        }

        .gapino-toast {
            padding:
                11px 14px;

            border-radius: 14px;

            text-align: center;

            margin-top: 8px;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.18);
        }

        /* =====================================================
           CALL OVERLAY
           ===================================================== */

        .gapino-call-overlay {
            position: fixed;

            inset: 0;

            z-index: 120000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 18px;

            background:
                rgba(
                    2,
                    6,
                    23,
                    0.80
                );

            backdrop-filter:
                blur(13px);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        .gapino-call-overlay.show {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }

        .gapino-call-card {
            width:
                min(410px, 100%);

            padding:
                28px 22px;

            border-radius: 28px;

            background:
                #0f172a;

            color: #ffffff;

            text-align: center;

            box-shadow:
                0 30px 90px
                rgba(0, 0, 0, 0.45);
        }

        .gapino-call-avatar {
            width: 96px;
            height: 96px;

            margin:
                0 auto 16px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            font-size: 34px;

            font-weight: 900;
        }

        .gapino-call-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .gapino-call-name {
            font-size: 22px;

            font-weight: 900;

            margin-bottom: 7px;
        }

        .gapino-call-status {
            font-size: 14px;

            opacity: 0.72;

            margin-bottom: 10px;
        }

        .gapino-call-timer {
            font-size: 30px;

            font-weight: 900;

            margin-bottom: 22px;
        }

        .gapino-call-actions {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 9px;
        }

        .gapino-call-button {
            min-width: 120px;

            padding:
                12px 16px;

            border: 0;

            border-radius: 14px;

            color: #ffffff;

            font-weight: 800;

            cursor: pointer;
        }

        .gapino-call-button.accept {
            background:
                #16a34a;
        }

        .gapino-call-button.reject {
            background:
                #dc2626;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 800px) {

            html,
            body {
                width: 100%;

                height: 100dvh;
            }

            .app-shell {
                width: 100%;

                height: 100dvh;

                min-height: 100dvh;
            }

            .sidebar {
                width: 100%;

                min-width: 100%;
            }

            .chat-area {
                display: none;

                width: 100%;

                min-width: 100%;
            }

            .app-shell.chat-open
                .sidebar {
                display: none;
            }

            .app-shell.chat-open
                .chat-area {
                display: flex;
            }

            .active-lives-section {
                margin:
                    0 8px 7px;
            }

            .active-lives-list {
                max-height:
                    155px;
            }

            .sidebar-footer {
                grid-template-columns:
                    1fr
                    1fr
                    1fr;

                padding:
                    9px 9px
                    max(
                        9px,
                        env(
                            safe-area-inset-bottom
                        )
                    );
            }

            .sidebar-action {
                min-height: 40px;

<body>

    <!-- =====================================================
         GAPINO APP
         ===================================================== -->

    <div
        class="app-shell"
        id="appShell"
    >

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <!-- BRAND -->

                <div class="brand">

                    <div class="brand-logo">
                        G

                </div>

                <button

                    class="icon-button"
                    type="button"
                    title="گفتگوی جدید"

                </button>

            </div>

            <!-- SEARCH -->

                <input
                    id="userSearch"
                    type="search"
                    placeholder="جستجوی کاربران..."
                    autocomplete="off"
                    spellcheck="false"
                >

            <!-- =================================================

                    <div

                    </div>

                    <button

                    >

                    </button>

                </div>

                <div

                    class="active-lives-list"
                >
                </div>

            </section>

            <!-- USERS -->

            <div
                id="usersList"
                class="users-list"
            >
            </div>

            <!-- FOOTER -->

            <div class="sidebar-footer">

                <button
                    id="liveButton"
                    class="sidebar-action"
                    type="button"
                    title="شروع پخش زنده"
                    aria-label="شروع پخش زنده"
                >
                    🔴

                    <span>

                </button>

                <button
                    id="profileButton"
                    class="sidebar-action"
                    type="button"
                    title="پروفایل"
                    aria-label="پروفایل"
                >
                    👤

                    <span>
                        پروفایل
                    </span>
                </button>

                <button
                    id="logoutButton"
                    class="sidebar-action"
                    type="button"
                    title="خروج"
                    aria-label="خروج"
                >
                    🚪

                    <span>
                        خروج
                    </span>
                </button>

            </div>

        </aside>

        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <main
            id="chatArea"
            class="chat-area"
        >

            <!-- HEADER -->

            <header class="chat-header">

                <div class="chat-contact">

                    <div
                        id="chatAvatar"
                        class="chat-avatar"
                    >
                        G
                    </div>

                    <div

                    >

                        <strong

                        >
                            انتخاب گفتگو
                        </strong>

                        <span
                            id="chatUserStatus"
                        >
                            یک کاربر را انتخاب کنید
                        </span>

                    </div>

                </div>

                <div
                    class="chat-header-actions"
                >

                    <!-- LIVE -->

                    <button
                        id="headerLiveButton"
                        type="button"
                        title="پخش زنده"
                        aria-label="پخش زنده"
                    >
                        🔴
                    </button>

                    <!-- CALL -->

                    <button
                        id="callButton"
                        class="icon-button"
                        type="button"
                        title="تماس صوتی"
                        aria-label="تماس صوتی"
                    >
                        📞
                    </button>

                    <!-- MESSAGE SEARCH -->

                    <button
                        id="chatSearchButton"
                        class="icon-button"
                        type="button"
                        title="جستجوی پیام"
                        aria-label="جستجوی پیام"
                    >
                        🔎
                    </button>

                    <!-- MENU -->

                    <button
                        id="chatMenuButton"
                        class="icon-button"
                        type="button"
                        title="منو"
                        aria-label="منو"

                        ⋮
                    </button>

            </header>

            <!-- =================================================
                 MESSAGES

            <section

                    <p>
                        برای شروع، یک کاربر را از فهرست انتخاب کن.
                    </p>

                </div>

                <div
                    id="messagesList"

                >
                </div>

                <div
                    id="typingIndicator"
                    class="typing-indicator"
                    hidden
                >
                    در حال نوشتن...
                </div>

            </section>

            <!-- FILE PREVIEW -->

            <div
                id="attachmentPreview"
                class="attachment-preview"
                hidden
            >
            </div>

            <!-- =================================================
                 COMPOSER
                 ================================================= -->

            <div class="chat-composer">

                <button
                    id="attachButton"
                    class="composer-button"
                    type="button"
                    title="پیوست فایل"
                    aria-label="پیوست فایل"
                >
                    📎

                <input
                    id="fileInput"
                    type="file"

                <textarea
                    id="messageInput"

                    placeholder="پیامت را بنویس..."

                    spellcheck="false"
                ></textarea>

                <button
                    id="voiceButton"
                    class="composer-button"
                    type="button"
                    title="ضبط صدا"
                    aria-label="ضبط صدا"

                </button>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    title="ارسال"

    <!-- =====================================================
         PROFILE MODAL
         ===================================================== -->

    <div
        id="profileModal"
        class="modal-overlay"
        hidden

        <div class="modal-card">

            <button

            <div class="modal-header">

                <h2>
                    پروفایل
                </h2>

            </div>

            <div class="profile-form">

                    id="profileAvatarPreview"

                    G
                </div>

                <label

                <input

                <label

                <textarea
                    id="profileBio"
                    class="form-input"
                    rows="4"

                ></textarea>

                <button
                    id="saveProfileButton"

            </div>

        </div>

    </div>

    <!-- =====================================================
         MESSAGE SEARCH MODAL
         ===================================================== -->

    <div
        id="messageSearchModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal-card">

            <button
                id="closeMessageSearchModal"
                class="modal-close"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>

            <div class="modal-header">

                <h2>
                    جستجوی پیام
                </h2>

            </div>

            <input
                id="messageSearchInput"
                class="form-input"
                type="search"
                placeholder="متن پیام..."
                autocomplete="off"
            >

            <div
                id="messageSearchResults"
                class="message-search-results"
            >
            </div>

        </div>

    </div>

    <!-- =====================================================
         TOAST
         ===================================================== -->

    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>

    <!-- =====================================================
         TURN SERVERS
         ===================================================== -->

    <script>
        /*
         * فعلاً TURN اختصاصی نداریم.
         * STUN در call.js و live.js استفاده می‌شود.
         */

        window.GAPINO_TURN_SERVERS = [];
    </script>

    <!-- =====================================================
         LIVE NAVIGATION + ACTIVE LIVE ROOMS
         ===================================================== -->

    <script>
        (function () {

            "use strict";

            const API =
                window.GAPINO_API_BASE ||
                window.location.origin;

            const liveButton =
                document.getElementById(
                    "liveButton"
                );

            const headerLiveButton =
                document.getElementById(
                    "headerLiveButton"
                );

            const activeLivesSection =
                document.getElementById(
                    "activeLivesSection"
                );

            const activeLivesList =
                document.getElementById(
                    "activeLivesList"
                );

            const refreshLivesButton =
                document.getElementById(
                    "refreshLivesButton"
                );

            function escapeHtml(value) {

                return String(
                    value ?? ""
                )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
            }

            function hostName(host) {

                return (
                    host?.display_name ||
                    host?.username ||
                    "کاربر"
                );
            }

            function hostAvatar(host) {

                const avatar =
                    String(
                        host?.avatar ||
                        ""
                    ).trim();

                if (!avatar) {

                    return escapeHtml(
                        hostName(host)
                            .charAt(0)
                            .toUpperCase() ||
                        "G"
                    );
                }

                const avatarUrl =
                    avatar.startsWith(
                        "http"
                    )
                        ? avatar
                        : API + avatar;

                return (
                    '<img src="' +
                    escapeHtml(
                        avatarUrl
                    ) +
                    '" alt="">'
                );
            }

            function openLive() {

                window.location.href =
                    "/live.html";
            }

            function joinLive(roomId) {

                const room =
                    String(
                        roomId || ""
                    ).trim();

                if (!room) {
                    return;
                }

                window.location.href =
                    "/live.html?room=" +
                    encodeURIComponent(
                        room
                    ) +
                    "&join=1";
            }

            async function loadActiveLives() {

                if (
                    !activeLivesSection ||
                    !activeLivesList
                ) {
                    return;
                }

                try {

                    const response =
                        await fetch(
                            API +
                            "/api/live/active",
                            {
                                method: "GET",

                                credentials:
                                    "include",

                                cache:
                                    "no-store",

                                headers: {
                                    "Accept":
                                        "application/json"
                                }
                            }
                        );

                    if (
                        !response.ok
                    ) {

                        activeLivesSection.hidden =
                            true;

                        activeLivesList.innerHTML =
                            "";

                        return;
                    }

                    const data =
                        await response.json();

                    const rooms =
                        Array.isArray(
                            data.live_rooms
                        )
                            ? data.live_rooms
                            : [];

                    activeLivesList.innerHTML =
                        "";

                    if (!rooms.length) {

                        activeLivesSection.hidden =
                            true;

                        return;
                    }

                    activeLivesSection.hidden =
                        false;

                    for (
                        const room
                        of rooms
                    ) {

                        const host =
                            room.host ||
                            {};

                        const roomId =
                            String(
                                room.room_id ||
                                ""
                            ).trim();

                        if (!roomId) {
                            continue;
                        }

                        const name =
                            hostName(
                                host
                            );

                        const viewers =
                            Math.max(
                                0,
                                Number(
                                    room.viewer_count
                                ) || 0
                            );

                        const button =
                            document.createElement(
                                "button"
                            );

                        button.type =
                            "button";

                        button.className =
                            "active-live-item";

                        button.dataset.room =
                            roomId;

                        button.title =
                            "ورود به لایو " +
                            name;

                        button.innerHTML =
                            '<div class="active-live-avatar">' +
                                hostAvatar(host) +
                            "</div>" +

                            '<div class="active-live-info">' +

                                '<div class="active-live-name">' +
                                    escapeHtml(name) +
                                "</div>" +

                                '<div class="active-live-meta">' +
                                    "👁️ " +
                                    viewers +
                                    " بیننده" +
                                "</div>" +

                            "</div>" +

                            '<span class="active-live-badge">' +
                                "LIVE" +
                            "</span>";

                        button.addEventListener(
                            "click",
                            function () {

                                joinLive(
                                    button.dataset.room
                                );

                            }
                        );

                        activeLivesList.appendChild(
                            button
                        );
                    }

                    if (
                        !activeLivesList.children.length
                    ) {

                        activeLivesSection.hidden =
                            true;
                    }

                } catch (error) {

                    console.error(
                        "GAPINO active live rooms error:",
                        error
                    );

                    activeLivesSection.hidden =
                        true;
                }
            }

            if (liveButton) {

                liveButton.addEventListener(
                    "click",
                    openLive
                );
            }

            if (headerLiveButton) {

                headerLiveButton.addEventListener(
                    "click",
                    openLive
                );
            }

            if (refreshLivesButton) {

                refreshLivesButton.addEventListener(
                    "click",
                    loadActiveLives
                );
            }

            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    loadActiveLives();

                    /*
                     * هر ۵ ثانیه فهرست Liveها
                     * تازه می‌شود.
                     */

                    window.setInterval(
                        loadActiveLives,
                        5000
                    );

                }
            );

        })();
    </script>

    <script

    ></script>
