<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>گپینو | چت</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=306"
    >

    <style>
        /* =====================================================
           GAPINO CHAT PAGE
           Mobile / Desktop
           ===================================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
        }

        /* =====================================================
           CHAT HEADER
           ===================================================== */

        .chat-header {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            min-width: 0 !important;
        }

        .chat-contact {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            min-width: 0 !important;
            flex: 1 1 auto !important;
        }

        .chat-contact-info {
            min-width: 0 !important;
        }

        .chat-contact-info strong,
        .chat-contact-info span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-header-actions {
            display: flex !important;
            align-items: center !important;
            justify-content: flex-end !important;
            gap: 5px !important;
            margin-inline-start: auto !important;
            flex: 0 0 auto !important;
        }

        .chat-header-actions .icon-button {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            width: 42px !important;
            min-width: 42px !important;
            max-width: 42px !important;

            height: 42px !important;
            min-height: 42px !important;
            max-height: 42px !important;

            padding: 0 !important;
            border-radius: 12px !important;

            visibility: visible !important;
            opacity: 1 !important;
        }

        #callButton {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            font-size: 19px !important;
            cursor: pointer;
        }

        #callButton:disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
        }

        /* =====================================================
           CALL OVERLAY
           ===================================================== */

        .gapino-call-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(2, 6, 23, 0.78);
            backdrop-filter: blur(12px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        .gapino-call-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .gapino-call-card {
            width: min(420px, 100%);

            box-sizing: border-box;

            padding: 28px 22px;

            border-radius: 28px;

            background: rgba(15, 23, 42, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45);

            text-align: center;
            color: #fff;
        }

        .gapino-call-avatar {
            width: 96px;
            height: 96px;

            margin: 0 auto 18px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 34px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }

        .gapino-call-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gapino-call-name {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .gapino-call-status {
            font-size: 15px;
            opacity: 0.75;
            margin-bottom: 12px;
        }

        .gapino-call-timer {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .gapino-call-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .gapino-call-button {
            border: 0;
            outline: none;

            min-width: 120px;

            padding: 13px 18px;

            border-radius: 15px;

            font-family: inherit;
            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .gapino-call-button:hover {
            transform: translateY(-1px);
        }

        .gapino-call-button:active {
            transform: translateY(1px);
        }

        .gapino-call-button.accept {
            background: #16a34a;
            color: #fff;
        }

        .gapino-call-button.reject {
            background: #dc2626;
            color: #fff;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {
            .chat-header {
                width: 100%;
                box-sizing: border-box;
            }

            .chat-contact {
                gap: 7px !important;
            }

            .chat-header-actions {
                gap: 4px !important;
            }

            .chat-header-actions .icon-button {
                width: 42px !important;
                min-width: 42px !important;
                max-width: 42px !important;

                height: 42px !important;
                min-height: 42px !important;
                max-height: 42px !important;
            }

            #callButton {
                font-size: 18px !important;
            }

            .gapino-call-card {
                width: 100%;
                max-width: 360px;
                padding: 25px 18px;
                border-radius: 24px;
            }

            .gapino-call-avatar {
                width: 84px;
                height: 84px;
                font-size: 30px;
            }

            .gapino-call-name {
                font-size: 20px;
            }

            .gapino-call-timer {
                font-size: 27px;
            }

            .gapino-call-button {
                width: 100%;
                min-width: 0;
            }
        }

        @media (max-width: 420px) {
            .chat-header-actions .icon-button {
                width: 39px !important;
                min-width: 39px !important;
                max-width: 39px !important;

                height: 39px !important;
                min-height: 39px !important;
                max-height: 39px !important;
            }

            #callButton {
                font-size: 17px !important;
            }
        }

        /* =====================================================
           SAFE AREA FOR MOBILE
           ===================================================== */

        @supports (padding: env(safe-area-inset-bottom)) {
            .chat-header {
                padding-top:
                    max(
                        0px,
                        env(safe-area-inset-top)
                    );
            }

            .gapino-call-overlay {
                padding-top:
                    max(
                        20px,
                        env(safe-area-inset-top)
                    );

                padding-bottom:
                    max(
                        20px,
                        env(safe-area-inset-bottom)
                    );
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         MAIN CHAT APP
         ===================================================== -->

    <div class="app-shell">

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-header">

                <div class="brand">
                    <div class="brand-logo">
                        G
                    </div>

                    <div class="brand-text">
                        <strong>گپینو</strong>
                        <span>پیام‌رسان</span>
                    </div>
                </div>

                <button
                    id="newChatButton"
                    class="icon-button"
                    type="button"
                    aria-label="گفتگوی جدید"
                    title="گفتگوی جدید"
                >
                    ✏️
                </button>

            </div>

            <!-- =================================================
                 SEARCH
                 ================================================= -->

            <div class="search-box">

                <input
                    id="userSearch"
                    type="search"
                    placeholder="جستجوی کاربران..."
                    autocomplete="off"
                    spellcheck="false"
                >

            </div>

            <!-- =================================================
                 USER LIST
                 ================================================= -->

            <div
                id="usersList"
                class="users-list"
            >
            </div>

            <!-- =================================================
                 SIDEBAR FOOTER
                 ================================================= -->

            <div class="sidebar-footer">

                <button
                    id="profileButton"
                    class="sidebar-action"
                    type="button"
                >
                    👤
                    <span>پروفایل</span>
                </button>

                <button
                    id="logoutButton"
                    class="sidebar-action"
                    type="button"
                >
                    🚪
                    <span>خروج</span>
                </button>

            </div>

        </aside>

        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <main
            id="chatArea"
            class="chat-area"
        >

            <!-- =================================================
                 CHAT HEADER
                 ================================================= -->

            <header class="chat-header">

                <div class="chat-contact">

                    <div
                        id="chatAvatar"
                        class="chat-avatar"
                    >
                        G
                    </div>

                    <div class="chat-contact-info">

                        <strong
                            id="chatUserName"
                        >
                            انتخاب گفتگو
                        </strong>

                        <span
                            id="chatUserStatus"
                        >
                            یک کاربر را انتخاب کنید
                        </span>

                    </div>

                </div>

                <div
                    class="chat-header-actions"
                >

                    <button
                        id="callButton"
                        class="icon-button"
                        type="button"
                        aria-label="تماس صوتی"
                        title="تماس صوتی"
                    >
                        📞
                    </button>

                    <button
                        id="chatSearchButton"
                        class="icon-button"
                        type="button"
                        aria-label="جستجوی پیام"
                        title="جستجوی پیام"
                    >
                        🔎
                    </button>

                    <button
                        id="chatMenuButton"
                        class="icon-button"
                        type="button"
                        aria-label="منو"
                        title="منو"
                    >
                        ⋮
                    </button>

                </div>

            </header>

            <!-- =================================================
                 MESSAGES
                 ================================================= -->

            <section
                id="messagesContainer"
                class="messages-container"
            >

                <div
                    id="emptyChat"
                    class="empty-chat"
                >

                    <div class="empty-chat-icon">
                        💬
                    </div>

                    <h2>
                        به گپینو خوش آمدی
                    </h2>

                    <p>
                        برای شروع، یک کاربر را از فهرست انتخاب کن.
                    </p>

                </div>

                <div
                    id="messagesList"
                    class="messages-list"
                >
                </div>

                <div
                    id="typingIndicator"
                    class="typing-indicator"
                    hidden
                >
                    در حال نوشتن...
                </div>

            </section>

            <!-- =================================================
                 FILE PREVIEW
                 ================================================= -->

            <div
                id="attachmentPreview"
                class="attachment-preview"
                hidden
            >
            </div>

            <!-- =================================================
                 CHAT COMPOSER
                 ================================================= -->

            <div class="chat-composer">

                <button
                    id="attachButton"
                    class="composer-button"
                    type="button"
                    aria-label="پیوست فایل"
                    title="پیوست فایل"
                >
                    📎
                </button>

                <input
                    id="fileInput"
                    type="file"
                    hidden
                >

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="پیامت را بنویس..."
                    autocomplete="off"
                    spellcheck="false"
                ></textarea>

                <button
                    id="voiceButton"
                    class="composer-button"
                    type="button"
                    aria-label="ضبط صدا"
                    title="ضبط صدا"
                >
                    🎙️
                </button>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    aria-label="ارسال پیام"
                    title="ارسال"
                >
                    ➤
                </button>

            </div>

        </main>

    </div>

    <!-- =====================================================
         PROFILE MODAL
         ===================================================== -->

    <div
        id="profileModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal-card">

            <button
                id="closeProfileModal"
                class="modal-close"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>

            <div class="modal-header">
                <h2>پروفایل</h2>
            </div>

            <div class="profile-form">

                <div
                    id="profileAvatarPreview"
                    class="profile-avatar-preview"
                >
                    G
                </div>

                <label
                    class="form-label"
                    for="profileDisplayName"
                >
                    نام نمایشی
                </label>

                <input
                    id="profileDisplayName"
                    class="form-input"
                    type="text"
                    maxlength="100"
                    autocomplete="off"
                >

                <label
                    class="form-label"
                    for="profileBio"
                >
                    درباره من
                </label>

                <textarea
                    id="profileBio"
                    class="form-input"
                    rows="4"
                    maxlength="500"
                ></textarea>

                <button
                    id="saveProfileButton"
                    class="primary-button"
                    type="button"
                >
                    ذخیره تغییرات
                </button>

            </div>

        </div>

    </div>

    <!-- =====================================================
         CHAT SEARCH MODAL
         ===================================================== -->

    <div
        id="messageSearchModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal-card">

            <button
                id="closeMessageSearchModal"
                class="modal-close"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>

            <div class="modal-header">
                <h2>جستجوی پیام</h2>
            </div>

            <input
                id="messageSearchInput"
                class="form-input"
                type="search"
                placeholder="متن پیام..."
                autocomplete="off"
            >

            <div
                id="messageSearchResults"
                class="message-search-results"
            >
            </div>

        </div>

    </div>

    <!-- =====================================================
         HIDDEN STATUS ELEMENTS
         ===================================================== -->

    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>

    <!-- =====================================================
         GAPINO SCRIPTS
         ===================================================== -->

    <script src="/frontend/chat.js?v=307" defer></script>

    <script>
        /*
         * ==========================================
         * GAPINO TURN SERVER
         * ==========================================
         *
         * فعلاً STUN گوگل فعال است.
         *
         * وقتی TURN واقعی داشته باشیم، فقط همین آرایه
         * را پر می‌کنیم.
         */

        window.GAPINO_TURN_SERVERS = [
            /*
            {
                urls: [
                    "turn:YOUR-TURN-SERVER:3478?transport=udp",
                    "turn:YOUR-TURN-SERVER:3478?transport=tcp"
                ],
                username: "YOUR_USERNAME",
                credential: "YOUR_PASSWORD"
            }
            */
        ];
    </script>

    <script
        src="/frontend/call.js?v=6"
        defer
    ></script>

</body>
</html>
