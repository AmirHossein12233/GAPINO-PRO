<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>ورود | گپینو</title>

  <meta name="theme-color" content="#0b0f19" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Tahoma,
        Arial,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top right,
          rgba(91, 92, 255, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(0, 214, 201, 0.10),
          transparent 30%
        ),
        #080b12;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 430px;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.28;
      pointer-events: none;
    }

    .glow.one {
      top: -70px;
      right: -50px;
      background: #5b5cff;
    }

    .glow.two {
      bottom: -90px;
      left: -60px;
      background: #00d6c9;
    }

    .card {
      position: relative;
      width: 100%;
      padding: 34px 26px 28px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: rgba(13, 17, 28, 0.88);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(145deg, #6264ff, #4749d9);
      box-shadow:
        0 15px 40px rgba(83, 85, 255, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      font-size: 37px;
      font-weight: 900;
      color: white;
    }

    .title {
      text-align: center;
      font-size: 29px;
      font-weight: 900;
      margin: 0;
      letter-spacing: -0.8px;
    }

    .subtitle {
      text-align: center;
      margin: 9px 0 30px;
      color: #9198aa;
      font-size: 14px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 17px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: #c7ccda;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.045);
      color: #fff;
      outline: none;
      padding: 0 17px;
      font-size: 15px;
      direction: rtl;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .input::placeholder {
      color: #646b7d;
    }

    .input:focus {
      border-color: rgba(100, 102, 255, 0.8);
      background: rgba(255, 255, 255, 0.06);
      box-shadow:
        0 0 0 4px rgba(92, 94, 255, 0.10);
    }

    .password-toggle {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #81889a;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:active {
      background: rgba(255, 255, 255, 0.07);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 3px 0 20px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ea5b6;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: #6264ff;
    }

    .status {
      display: none;
      margin: 0 0 16px;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.8;
      border: 1px solid transparent;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.09);
      border-color: rgba(239, 68, 68, 0.22);
      color: #ff9b9b;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.09);
      border-color: rgba(34, 197, 94, 0.22);
      color: #8ef0ae;
    }

    .status.info {
      background: rgba(96, 165, 250, 0.09);
      border-color: rgba(96, 165, 250, 0.22);
      color: #9ecbff;
    }

    .login-btn {
      width: 100%;
      height: 57px;
      border: 0;
      border-radius: 17px;
      background:
        linear-gradient(135deg, #6567ff, #4c4fe1);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 15px 34px rgba(85, 87, 255, 0.28);
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        box-shadow 0.15s ease;
    }

    .login-btn:hover {
      box-shadow:
        0 18px 40px rgba(85, 87, 255, 0.34);
    }

    .login-btn:active {
      transform: scale(0.985);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .btn-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    .loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .register-box {
      margin-top: 24px;
      padding-top: 21px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      text-align: center;
      color: #81889a;
      font-size: 13px;
    }

    .register-link {
      display: inline-block;
      margin-top: 8px;
      color: #7f81ff;
      text-decoration: none;
      font-weight: 800;
    }

    .register-link:active {
      opacity: 0.7;
    }

    .footer {
      text-align: center;
      color: #51586a;
      font-size: 11px;
      margin-top: 18px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 430px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 30px 20px 24px;
        border-radius: 24px;
      }

      .logo {
        width: 70px;
        height: 70px;
        border-radius: 21px;
        font-size: 33px;
      }

      .title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="card">
      <div class="logo-wrap">
        <div class="logo" aria-label="گپینو">گ</div>
      </div>

      <h1 class="title">ورود به گپینو</h1>

      <p class="subtitle">
        وارد حساب خودت شو و به چت‌هایت دسترسی پیدا کن
      </p>

      <div id="status" class="status" role="alert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label class="label" for="username">نام کاربری</label>

          <div class="input-wrap">
            <input
              id="username"
              class="input"
              type="text"
              name="username"
              placeholder="نام کاربری را وارد کنید"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              maxlength="32"
              required
            />
          </div>
        </div>

        <div class="field">
          <label class="label" for="password">رمز عبور</label>

          <div class="input-wrap">
            <input
              id="password"
              class="input"
              type="password"
              name="password"
              placeholder="رمز عبور را وارد کنید"
              autocomplete="current-password"
              minlength="6"
              maxlength="128"
              required
            />

            <button
              id="togglePassword"
              class="password-toggle"
              type="button"
              aria-label="نمایش رمز عبور"
            >
              👁
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember">
            <input id="remember" type="checkbox" checked />
            <span>مرا به خاطر بسپار</span>
          </label>
        </div>

        <button id="loginButton" class="login-btn" type="submit">
          <span class="btn-content">
            <span id="spinner" class="spinner"></span>
            <span id="buttonText">ورود به گپینو</span>
          </span>
        </button>
      </form>

      <div class="register-box">
        حساب کاربری نداری؟
        <br />
        <a class="register-link" href="/register.html">
          ساخت حساب جدید
        </a>
      </div>
    </main>

    <div class="footer">
      GAPINO Messenger
    </div>
  </div>

  <script>
    "use strict";

    /*
      مهم:
      در نسخه وب و APK از آدرس ثابت سرور استفاده می‌کنیم.
      دیگر از window.location.origin برای API استفاده نمی‌شود.
    */
    const API = "https://mygapino.shop";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");

    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");
    const statusBox = document.getElementById("status");

    const togglePassword = document.getElementById("togglePassword");

    const TOKEN_KEY = "gapino_token";
    const USER_KEY = "gapino_user";

    function showStatus(message, type = "error") {
      statusBox.textContent = message;
      statusBox.className = "status show " + type;
    }

    function hideStatus() {
      statusBox.textContent = "";
      statusBox.className = "status";
    }

    function setLoading(loading) {
      loginButton.disabled = loading;

      if (loading) {
        loginButton.classList.add("loading");
        buttonText.textContent = "در حال ورود...";
      } else {
        loginButton.classList.remove("loading");
        buttonText.textContent = "ورود به گپینو";
      }
    }

    function saveToken(token) {
      if (!token) return;

      try {
        localStorage.setItem(TOKEN_KEY, token);
      } catch (error) {
        console.warn("localStorage token error:", error);
      }
    }

    function saveUser(user) {
      if (!user) return;

      try {
        localStorage.setItem(USER_KEY, JSON.stringify(user));
      } catch (error) {
        console.warn("localStorage user error:", error);
      }
    }

    function getToken() {
      try {
        return localStorage.getItem(TOKEN_KEY) || "";
      } catch (error) {
        return "";
      }
    }

    function clearLocalAuth() {
      try {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
      } catch (error) {
        console.warn("localStorage clear error:", error);
      }
    }

    function authHeaders(extra = {}) {
      const headers = {
        ...extra
      };

      const token = getToken();

      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }

      return headers;
    }

    async function parseResponse(response) {
      const contentType =
        response.headers.get("content-type") || "";

      if (contentType.includes("application/json")) {
        return await response.json();
      }

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch {
        return {
          detail: text
        };
      }
    }

    async function requestMe() {
      const response = await fetch(API + "/api/me", {
        method: "GET",
        credentials: "include",
        cache: "no-store",
        headers: authHeaders({
          "Accept": "application/json"
        })
      });

      const data = await parseResponse(response);

      if (!response.ok) {
        throw new Error(
          data?.detail || "جلسه ورود معتبر نیست"
        );
      }

      return data;
    }

    async function checkExistingSession() {
      try {
        const token = getToken();

        const response = await fetch(API + "/api/me", {
          method: "GET",
          credentials: "include",
          cache: "no-store",
          headers: authHeaders({
            "Accept": "application/json"
          })
        });

        if (!response.ok) {
          return false;
        }

        const user = await parseResponse(response);

        if (user && user.id) {
          saveUser(user);

          /*
            کاربر از قبل وارد شده.
            مستقیم به chat برو.
          */
          window.location.replace("/chat.html");
          return true;
        }

        return false;
      } catch (error) {
        console.warn("Session check failed:", error);
        return false;
      }
    }

    async function loginUser(username, password) {
      const formData = new FormData();

      formData.append("username", username);
      formData.append("password", password);

      const response = await fetch(API + "/api/login", {
        method: "POST",
        body: formData,
        credentials: "include",
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      });

      const data = await parseResponse(response);

      if (!response.ok) {
        throw new Error(
          data?.detail ||
          "نام کاربری یا رمز عبور نادرست است"
        );
      }

      return data;
    }

    async function handleLogin(event) {
      event.preventDefault();

      hideStatus();

      const username =
        usernameInput.value.trim().toLowerCase();

      const password =
        passwordInput.value;

      if (!username) {
        showStatus("نام کاربری را وارد کنید.");
        usernameInput.focus();
        return;
      }

      if (username.length < 3) {
        showStatus("نام کاربری باید حداقل ۳ کاراکتر باشد.");
        usernameInput.focus();
        return;
      }

      if (!password) {
        showStatus("رمز عبور را وارد کنید.");
        passwordInput.focus();
        return;
      }

      if (password.length < 6) {
        showStatus("رمز عبور باید حداقل ۶ کاراکتر باشد.");
        passwordInput.focus();
        return;
      }

      setLoading(true);

      try {
        const data = await loginUser(
          username,
          password
        );

        /*
          سرور باید در صورت فعال بودن Token،
          یکی از این نام‌ها را برگرداند.
        */
        const token =
          data?.token ||
          data?.access_token ||
          data?.accessToken ||
          "";

        if (token) {
          saveToken(token);
        }

        if (data?.user) {
          saveUser(data.user);
        }

        /*
          یک بار /api/me را بررسی می‌کنیم تا مطمئن شویم
          ورود واقعاً ثبت شده است.
        */
        let verifiedUser = null;

        try {
          verifiedUser = await requestMe();
        } catch (verifyError) {
          /*
            اگر بک‌اند فقط Token داده باشد ولی Session Cookie
            روی WebView ذخیره نشده باشد، با خود Token دوباره
            تلاش می‌کنیم.
          */
          if (!token) {
            throw verifyError;
          }

          const meResponse = await fetch(
            API + "/api/me",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store",
              headers: authHeaders({
                "Accept": "application/json"
              })
            }
          );

          const meData =
            await parseResponse(meResponse);

          if (!meResponse.ok) {
            throw new Error(
              meData?.detail ||
              "ورود تأیید نشد"
            );
          }

          verifiedUser = meData;
        }

        if (verifiedUser) {
          saveUser(verifiedUser);
        }

        showStatus(
          "ورود با موفقیت انجام شد. در حال ورود به چت...",
          "success"
        );

        /*
          کمی زمان برای نمایش پیام موفقیت.
        */
        setTimeout(() => {
          window.location.replace("/chat.html");
        }, 350);

      } catch (error) {
        console.error("GAPINO LOGIN ERROR:", error);

        let message =
          error?.message ||
          "خطا در ورود به حساب";

        if (
          message.includes("Failed to fetch") ||
          message.includes("NetworkError") ||
          message.includes("Load failed")
        ) {
          message =
            "ارتباط با سرور گپینو برقرار نشد. اتصال اینترنت را بررسی کنید.";
        }

        showStatus(message, "error");
        setLoading(false);
      }
    }

    togglePassword.addEventListener(
      "click",
      () => {
        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword ? "text" : "password";

        togglePassword.textContent =
          isPassword ? "🙈" : "👁";

        togglePassword.setAttribute(
          "aria-label",
          isPassword
            ? "مخفی کردن رمز عبور"
            : "نمایش رمز عبور"
        );
      }
    );

    form.addEventListener(
      "submit",
      handleLogin
    );

    /*
      با Enter در نام کاربری، به رمز عبور برو.
    */
    usernameInput.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          passwordInput.focus();
        }
      }
    );

    /*
      حذف فاصله اضافی اول و آخر نام کاربری.
    */
    usernameInput.addEventListener(
      "blur",
      () => {
        usernameInput.value =
          usernameInput.value
            .trim()
            .toLowerCase();
      }
    );

    /*
      هنگام بارگذاری صفحه:
      اگر قبلاً وارد شده، مستقیماً chat.html باز شود.
    */
    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        try {
          const alreadyLoggedIn =
            await checkExistingSession();

          if (alreadyLoggedIn) {
            return;
          }
        } catch (error) {
          console.warn(
            "Initial authentication check failed:",
            error
          );
        }

        /*
          اگر نام کاربری قبلاً ذخیره شده باشد،
          فقط خودش را در فرم قرار می‌دهیم.
        */
        try {
          const savedUser =
            JSON.parse(
              localStorage.getItem(USER_KEY) || "null"
            );

          if (
            savedUser &&
            savedUser.username
          ) {
            usernameInput.value =
              savedUser.username;
          }
        } catch (error) {
          console.warn(
            "Saved user read error:",
            error
          );
        }

        setTimeout(() => {
          usernameInput.focus();
        }, 150);
      }
    );

    /*
      جلوگیری از ارسال دوباره فرم در زمان Loading.
    */
    window.addEventListener(
      "beforeunload",
      () => {
        loginButton.disabled = true;
      }
    );
  </script>
</body>
</html>
