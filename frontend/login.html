<script>
"use strict";

/* =========================================================
   GAPINO LOGIN
   API: /api/login
   SESSION: Cookie
   ========================================================= */

const API =
    window.GAPINO_API_BASE ||
    window.location.origin;

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");

const togglePasswordButton =
    document.getElementById("togglePassword");

const registerButton =
    document.getElementById("registerButton");

const backButton =
    document.getElementById("backButton");

/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
    text,
    type = ""
) {
    if (!loginMessage) {
        return;
    }

    loginMessage.textContent =
        String(text || "");

    loginMessage.className =
        "message";

    if (type) {
        loginMessage.classList.add(
            type
        );
    }
}

/* =========================================================
   LOADING
   ========================================================= */

function setLoading(
    loading
) {
    if (!loginButton) {
        return;
    }

    loginButton.disabled =
        Boolean(loading);

    loginButton.textContent =
        loading
            ? "در حال ورود..."
            : "ورود";
}

/* =========================================================
   READ JSON
   ========================================================= */

async function readServerJson(
    response
) {
    const text =
        await response.text();

    if (!text) {
        return null;
    }

    try {
        return JSON.parse(
            text
        );
    } catch (error) {
        console.error(
            "GAPINO invalid JSON:",
            text
        );

        throw new Error(
            "پاسخ نامعتبر از سرور دریافت شد."
        );
    }
}

/* =========================================================
   LOGIN
   ========================================================= */

async function loginUser(
    username,
    password
) {
    const form =
        new URLSearchParams();

    form.set(
        "username",
        username
    );

    form.set(
        "password",
        password
    );

    let response;

    try {
        response =
            await fetch(
                `${API}/api/login`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        form.toString(),

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );

    } catch (error) {
        console.error(
            "GAPINO LOGIN FETCH ERROR:",
            error
        );

        throw new Error(
            "ارتباط با سرور برقرار نشد."
        );
    }

    const data =
        await readServerJson(
            response
        );

    if (!response.ok) {
        throw new Error(
            data?.detail ||
            data?.message ||
            `خطای ورود (${response.status})`
        );
    }

    if (
        !data ||
        data.ok !== true ||
        !data.user ||
        !data.user.id
    ) {
        console.error(
            "GAPINO unexpected login response:",
            data
        );

        throw new Error(
            "پاسخ نامعتبر از سرور دریافت شد."
        );
    }

    return data;
}

/* =========================================================
   VERIFY SESSION
   ========================================================= */

async function verifySession() {
    try {
        const response =
            await fetch(
                `${API}/api/me`,
                {
                    method:
                        "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {
            return null;
        }

        const data =
            await response.json();

        /*
         * نسخه فعلی بک‌اند:
         * کاربر مستقیماً برمی‌گردد.
         *
         * برای نسخه قدیمی:
         * { authenticated, user }
         * هم پشتیبانی می‌شود.
         */

        if (
            data?.authenticated === true &&
            data?.user?.id
        ) {
            return data.user;
        }

        if (
            data?.id
        ) {
            return data;
        }

        return null;

    } catch (error) {
        console.error(
            "GAPINO ME ERROR:",
            error
        );

        return null;
    }
}

/* =========================================================
   HANDLE LOGIN
   ========================================================= */

async function handleLogin(
    event
) {
    event.preventDefault();

    const username =
        String(
            usernameInput?.value ||
            ""
        ).trim();

    const password =
        String(
            passwordInput?.value ||
            ""
        );

    if (!username) {
        showMessage(
            "نام کاربری را وارد کن.",
            "error"
        );

        return;
    }

    if (!password) {
        showMessage(
            "رمز عبور را وارد کن.",
            "error"
        );

        return;
    }

    setLoading(true);

    showMessage(
        "در حال ورود..."
    );

    try {
        /*
         * Login
         */

        const result =
            await loginUser(
                username,
                password
            );

        /*
         * ذخیره کاربر
         */

        localStorage.setItem(
            "gapino_user",
            JSON.stringify(
                result.user
            )
        );

        /*
         * بررسی واقعی Session
         */

        showMessage(
            "ورود موفق بود؛ در حال بررسی نشست...",
            "success"
        );

        const sessionUser =
            await verifySession();

        if (!sessionUser) {
            console.error(
                "GAPINO LOGIN OK BUT SESSION NOT FOUND"
            );

            /*
             * اطلاعات قدیمی را پاک می‌کنیم
             * تا chat.html دوباره کاربر قبلی
             * را به اشتباه استفاده نکند.
             */

            localStorage.removeItem(
                "gapino_user"
            );

            throw new Error(
                "ورود انجام شد اما نشست کاربری ایجاد نشد."
            );
        }

        /*
         * ذخیره اطلاعات به‌روز
         */

        localStorage.setItem(
            "gapino_user",
            JSON.stringify(
                sessionUser
            )
        );

        showMessage(
            "ورود موفق بود. در حال ورود به گپینو...",
            "success"
        );

        /*
         * ورود به صفحه چت
         */

        window.location.replace(
            "/chat.html"
        );

    } catch (error) {
        console.error(
            "GAPINO LOGIN ERROR:",
            error
        );

        showMessage(
            error.message ||
            "ورود انجام نشد.",
            "error"
        );

        setLoading(false);
    }
}

/* =========================================================
   PASSWORD VISIBILITY
   ========================================================= */

if (
    togglePasswordButton
) {
    togglePasswordButton.addEventListener(
        "click",
        () => {
            if (!passwordInput) {
                return;
            }

            const showing =
                passwordInput.type ===
                "text";

            passwordInput.type =
                showing
                    ? "password"
                    : "text";

            togglePasswordButton.textContent =
                showing
                    ? "👁️"
                    : "🙈";
        }
    );
}

/* =========================================================
   REGISTER
   ========================================================= */

if (
    registerButton
) {
    registerButton.addEventListener(
        "click",
        () => {
            window.location.assign(
                "/register.html"
            );
        }
    );
}

/* =========================================================
   BACK
   ========================================================= */

if (
    backButton
) {
    backButton.addEventListener(
        "click",
        () => {
            window.location.assign(
                "/"
            );
        }
    );
}

/* =========================================================
   ALREADY LOGGED IN
   ========================================================= */

async function checkAlreadyLoggedIn() {
    const user =
        await verifySession();

    if (!user) {
        return;
    }

    localStorage.setItem(
        "gapino_user",
        JSON.stringify(
            user
        )
    );

    window.location.replace(
        "/chat.html"
    );
}

/* =========================================================
   START
   ========================================================= */

if (
    loginForm
) {
    loginForm.addEventListener(
        "submit",
        handleLogin
    );
}

/*
 * فقط وقتی صفحه login باز شد،
 * Session قبلی را بررسی می‌کنیم.
 *
 * بعد از logout چون API session را پاک می‌کند،
 * اینجا دیگر مستقیماً وارد chat نمی‌شود.
 */

checkAlreadyLoggedIn();

</script>
