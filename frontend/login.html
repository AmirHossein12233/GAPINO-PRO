<title>گپینو | ورود</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
        margin: 0;
    }

    body {
        font-family:
            Tahoma,
            Arial,
            "Segoe UI",
            sans-serif;

        direction: rtl;

        color: #f8fafc;

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(99, 102, 241, .22),
                transparent 30%
            ),
            radial-gradient(
                circle at 85% 85%,
                rgba(139, 92, 246, .18),
                transparent 30%
            ),
            #070b16;

        overflow-x: hidden;
    }

    button,
    input {
        font: inherit;
    }

    button {
        border: 0;
    }

    .page {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        position: relative;

        overflow: hidden;
    }

    /* ================= BACKGROUND ================= */

    .background {
        position: fixed;
        inset: 0;

        pointer-events: none;
    }

    .orb {
        position: absolute;

        border-radius: 50%;

        filter: blur(100px);

        opacity: .22;
    }

    .orb.one {
        width: 380px;
        height: 380px;

        top: -160px;
        right: -100px;

        background: #6366f1;
    }

    .orb.two {
        width: 350px;
        height: 350px;

        left: -130px;
        bottom: -150px;

        background: #8b5cf6;
    }

    .orb.three {
        width: 220px;
        height: 220px;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        background: #22c55e;

        opacity: .035;
    }

    /* ================= CARD ================= */

    .card {
        position: relative;
        z-index: 5;

        width: 100%;
        max-width: 450px;

        padding: 34px;

        border-radius: 28px;

        border:
            1px solid
            rgba(255,255,255,.10);

        background:
            rgba(13,20,36,.94);

        box-shadow:
            0 35px 100px
            rgba(0,0,0,.50);
    }

    /* ================= BRAND ================= */

    .brand {
        display: flex;

        align-items: center;

        gap: 14px;
    }

    .logo {
        width: 62px;
        height: 62px;

        display: flex;

        align-items: center;
        justify-content: center;

        flex: 0 0 62px;

        border-radius: 20px;

        color: white;

        font-size: 29px;

        font-weight: 900;

        background:
            linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

        box-shadow:
            0 18px 40px
            rgba(99,102,241,.34);
    }

    .brand h1 {
        margin: 0;

        font-size: 25px;

        line-height: 1.3;
    }

    .brand p {
        margin:
            5px 0 0;

        color: #94a3b8;

        font-size: 10px;
    }

    /* ================= TITLE ================= */

    .title {
        margin-top: 30px;
    }

    .title h2 {
        margin: 0;

        font-size: 22px;

        line-height: 1.5;
    }

    .title p {
        margin:
            8px 0 0;

        color: #94a3b8;

        font-size: 10px;

        line-height: 1.9;
    }

    /* ================= FORM ================= */

    form {
        margin-top: 26px;
    }

    .field {
        margin-bottom: 17px;
    }

    .field.hidden {
        display: none;
    }

    .field label {
        display: block;

        margin-bottom: 8px;

        color: #94a3b8;

        font-size: 10px;

        font-weight: 600;
    }

    .input {
        width: 100%;

        height: 54px;

        padding:
            0 13px;

        display: flex;

        align-items: center;

        gap: 8px;

        border-radius: 15px;

        border:
            1px solid
            rgba(255,255,255,.09);

        background:
            rgba(255,255,255,.025);

        transition:
            border-color .2s ease,
            box-shadow .2s ease;
    }

    .input:focus-within {
        border-color:
            #6366f1;

        box-shadow:
            0 0 0 4px
            rgba(99,102,241,.10);
    }

    .input-icon {
        width: 26px;
        height: 26px;

        flex: 0 0 26px;

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 14px;

        opacity: .85;
    }

    .input input {
        width: 100%;
        height: 100%;

        min-width: 0;

        border: 0;
        outline: 0;

        background:
            transparent;

        color:
            #f8fafc;

        font-size:
            11px;
    }

    .input input::placeholder {
        color:
            #64748b;
    }

    .password-toggle {
        width: 34px;
        height: 34px;

        flex: 0 0 34px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 10px;

        background:
            transparent;

        color:
            #94a3b8;

        cursor:
            pointer;

        font-size:
            15px;
    }

    .password-toggle:hover {
        background:
            rgba(99,102,241,.10);

        color:
            white;
    }

    /* ================= MESSAGE ================= */

    .message {
        min-height: 22px;

        margin:
            5px 0;

        display: flex;

        align-items: center;
        justify-content: center;

        text-align: center;

        font-size: 9px;

        line-height: 1.7;
    }

    .message.error {
        color: #fca5a5;
    }

    .message.success {
        color: #86efac;
    }

    /* ================= BUTTON ================= */

    .submit {
        width: 100%;
        height: 54px;

        margin-top: 5px;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 9px;

        border-radius: 15px;

        color: white;

        background:
            linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

        cursor:
            pointer;

        font-size: 11px;

        font-weight: 700;

        box-shadow:
            0 15px 35px
            rgba(99,102,241,.22);

        transition:
            transform .2s ease,
            box-shadow .2s ease,
            opacity .2s ease;
    }

    .submit:hover {
        transform:
            translateY(-2px);

        box-shadow:
            0 20px 45px
            rgba(99,102,241,.32);
    }

    .submit:active {
        transform:
            translateY(0);
    }

    .submit:disabled {
        opacity: .65;

        cursor:
            not-allowed;

        transform:
            none;
    }

    .spinner {
        width: 17px;
        height: 17px;

        border-radius: 50%;

        border:
            2px solid
            rgba(255,255,255,.35);

        border-top-color:
            white;

        animation:
            spin .7s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* ================= DIVIDER ================= */

    .divider {
        margin:
            22px 0;

        display: flex;

        align-items: center;

        gap: 10px;

        color:
            #64748b;

        font-size: 8px;
    }

    .divider::before,
    .divider::after {
        content: "";

        height: 1px;

        flex: 1;

        background:
            rgba(255,255,255,.08);
    }

    /* ================= SWITCH ================= */

    .switch {
        display: flex;

        align-items: center;
        justify-content: center;

        gap: 6px;

        color:
            #94a3b8;

        font-size: 9px;
    }

    .switch button {
        padding: 0;

        background:
            transparent;

        color:
            #a5b4fc;

        cursor:
            pointer;

        font-size:
            9px;

        font-weight:
            700;
    }

    .switch button:hover {
        color:
            #c4b5fd;
    }

    /* ================= SECURITY ================= */

    .security {
        margin-top: 20px;

        min-height: 40px;

        padding:
            9px 12px;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 7px;

        border:
            1px solid
            rgba(34,197,94,.08);

        border-radius:
            12px;

        background:
            rgba(34,197,94,.035);

        color:
            #94a3b8;

        font-size:
            8px;
    }

    .security-icon {
        font-size:
            13px;
    }

    /* ================= FOOTER ================= */

    .footer {
        margin-top: 22px;

        padding-top: 15px;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 6px;

        border-top:
            1px solid
            rgba(255,255,255,.07);

        color:
            #64748b;

        font-size:
            7px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

        .page {
            padding:
                14px;
        }

        .card {
            padding:
                27px 19px;

            border-radius:
                22px;
        }

        .logo {
            width:
                54px;

            height:
                54px;

            flex-basis:
                54px;

            border-radius:
                17px;

            font-size:
                25px;
        }

        .brand h1 {
            font-size:
                22px;
        }

        .title h2 {
            font-size:
                19px;
        }

        .input {
            height:
                52px;
        }

        .submit {
            height:
                52px;
        }
    }
</style>

</div>

<script>
"use strict";

const API_BASE =
    window.GAPINO_API_BASE ||
    window.location.origin;

let mode = "login";


const form =
    document.getElementById(
        "authForm"
    );

const title =
    document.getElementById(
        "title"
    );

const description =
    document.getElementById(
        "description"
    );

const displayNameField =
    document.getElementById(
        "displayNameField"
    );

const displayName =
    document.getElementById(
        "displayName"
    );

const username =
    document.getElementById(
        "username"
    );

const password =
    document.getElementById(
        "password"
    );

const passwordToggle =
    document.getElementById(
        "passwordToggle"
    );

const message =
    document.getElementById(
        "message"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const submitText =
    document.getElementById(
        "submitText"
    );

const spinner =
    document.getElementById(
        "spinner"
    );

const switchText =
    document.getElementById(
        "switchText"
    );

const switchButton =
    document.getElementById(
        "switchButton"
    );


function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        `message ${type}`;

}


function setLoading(
    loading
) {

    submitButton.disabled =
        loading;

    spinner.hidden =
        !loading;

    if (loading) {

        submitText.textContent =
            mode === "login"
                ? "در حال ورود..."
                : "در حال ساخت حساب...";

    } else {

        submitText.textContent =
            mode === "login"
                ? "ورود به گپینو"
                : "ساخت حساب گپینو";

    }

}


function setMode(
    newMode
) {

    mode =
        newMode;

    showMessage(
        ""
    );

    password.value =
        "";

    if (
        mode === "register"
    ) {

        title.textContent =
            "ساخت حساب جدید ✨";

        description.textContent =
            "در چند ثانیه حساب گپینوی خودت را بساز.";

        displayNameField.classList.remove(
            "hidden"
        );

        displayName.required =
            true;

        submitText.textContent =
            "ساخت حساب گپینو";

        switchText.textContent =
            "قبلاً حساب ساخته‌اید؟";

        switchButton.textContent =
            "وارد شوید";

        password.autocomplete =
            "new-password";

    } else {

        title.textContent =
            "خوش برگشتی 👋";

        description.textContent =
            "برای ورود به گپینو اطلاعات حساب خود را وارد کنید.";

        displayNameField.classList.add(
            "hidden"
        );

        displayName.required =
            false;

        submitText.textContent =
            "ورود به گپینو";

        switchText.textContent =
            "حساب کاربری ندارید؟";

        switchButton.textContent =
            "ثبت‌نام کنید";

        password.autocomplete =
            "current-password";
    }

}


passwordToggle.addEventListener(
    "click",
    () => {

        const hidden =
            password.type ===
            "password";

        password.type =
            hidden
                ? "text"
                : "password";

        passwordToggle.textContent =
            hidden
                ? "🙈"
                : "👁️";

    }
);


switchButton.addEventListener(
    "click",
    () => {

        setMode(
            mode === "login"
                ? "register"
                : "login"
        );

    }
);


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const user =
            username.value
                .trim()
                .toLowerCase();

        const pass =
            password.value;

        const name =
            displayName.value.trim();


        if (user.length < 3) {

            showMessage(
                "نام کاربری باید حداقل ۳ کاراکتر باشد.",
                "error"
            );

            username.focus();

            return;
        }


        if (pass.length < 6) {

            showMessage(
                "رمز عبور باید حداقل ۶ کاراکتر باشد.",
                "error"
            );

            password.focus();

            return;
        }


        if (
            mode === "register" &&
            !name
        ) {

            showMessage(
                "نام نمایشی را وارد کنید.",
                "error"
            );

            displayName.focus();

            return;
        }


        setLoading(
            true
        );


        try {

            const body =
                new URLSearchParams();

            body.set(
                "username",
                user
            );

            body.set(
                "password",
                pass
            );


            let endpoint;


            if (
                mode === "login"
            ) {

                endpoint =
                    "/api/login";

            } else {

                endpoint =
                    "/api/register";

                body.set(
                    "display_name",
                    name
                );
            }


            const response =
                await fetch(
                    `${API_BASE}${endpoint}`,
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        credentials:
                            "include",

                        body:
                            body.toString()
                    }
                );


            let data =
                null;


            try {

                data =
                    await response.json();

            } catch {}


            if (
                !response.ok
            ) {

                throw new Error(
                    data?.detail ||
                    "عملیات انجام نشد."
                );

            }


            if (
                data?.user
            ) {

                localStorage.setItem(
                    "gapino_user",
                    JSON.stringify(
                        data.user
                    )
                );

            }


            showMessage(
                mode === "login"
                    ? "ورود با موفقیت انجام شد. ✅"
                    : "حساب شما با موفقیت ساخته شد. ✅",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "/chat.html";

                },
                500
            );


        } catch (
            error
        ) {

            console.error(
                error
            );

            showMessage(
                error.message ||
                "ارتباط با سرور برقرار نشد.",
                "error"
            );

        } finally {

            setLoading(
                false
            );

        }

    }
);

</script>
